name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/encore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2g" 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        run: |
          {
            echo '### Compile errors'
            echo '```'
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/Encore/Encore/##' | head -40
            grep -A8 'What went wrong' build.log | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: encore-release
          path: build/outputs/apk/release/*.apk
